input_datetime:
  energy_planner_extras_start:
    name: Start time
    has_date: true
    has_time: true
  energy_planner_extras_end:
    name: End time
    has_date: true
    has_time: true
input_number:
  energy_planner_extras_soc:
    name: Battery SOC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: '%'
    mode: box
input_select:
  energy_planner_extras_state:
    name: Energy Planner State
    options:
      - "charge"
      - "discharge"
      - "pause"
      - "sell"
      - "sell-excess"
      - "discard-excess"
input_button:
  energy_planner_extras_add_slot:
    name: Add Slot
    icon: mdi:plus
  energy_planner_extras_clear_manual_slots:
    name: Clear Manual Slots
    icon: mdi:minus

automation:
  - alias: "Energy Planner Clear Manual Slots"
    triggers:
      - trigger: state
        entity_id:
          - input_button.energy_planner_extras_clear_manual_slots
    action:
      - service: energy_planner.clear_manual_slots

  - alias: "Energy Planner Add Slot"
    trigger:
      - trigger: state
        entity_id:
          - input_button.energy_planner_extras_add_slot
    action:
      # The SOC is a target only for charge and sell; without it they charge to the
      # max SOC or sell down to the reserve
      - variables:
          state: "{{ states('input_select.energy_planner_extras_state') }}"
          slot:
            start: "{{ states('input_datetime.energy_planner_extras_start') }}"
            end: "{{ states('input_datetime.energy_planner_extras_end') }}"
            state: "{{ state }}"
      - service: energy_planner.add_slot
        data: >-
          {% if state in ['charge', 'sell'] %}
            {{ dict(slot, soc=states('input_number.energy_planner_extras_soc') | float) }}
          {% else %}
            {{ slot }}
          {% endif %}

# Card for the car's SOC (a package can not hold cards: paste it into a dashboard).
# After plugging in a car that does not report its SOC, enter it here: the plan
