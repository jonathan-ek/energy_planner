add_slot:
  name: Add manual slot
  description: >-
    Override the battery plan with an action state from start to end. The times are
    rounded out to whole quarters. Where manual slots overlap, the last added wins.
  fields:
    start:
      name: Start
      description: Start of the slot (rounded down to the quarter)
      selector:
        datetime:
      required: true
    end:
      name: End
      description: End of the slot (rounded up to the quarter)
      selector:
        datetime:
      required: true
    state:
      name: State
      description: One of 'charge', 'discharge', 'pause', 'sell', 'sell-excess', 'discard-excess'
      example: "charge"
      required: true
      selector:
        select:
          options:
            - "charge"
            - "discharge"
            - "sell"
            - "sell-excess"
            - "discard-excess"
            - "pause"
    soc:
      name: Target SOC
      description: >-
        For 'charge': charge up to it, then hold (default the max SOC). For 'sell':
        sell down to it, then self-use (default the reserve SOC). Ignored otherwise.
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider

remove_manual_slot:
  name: Remove manual slot
  description: Remove the manual slots that start in the quarter of the given time
  fields:
    start:
      name: Start
      description: Start of the slot to remove
      selector:
        datetime:
      required: true

clear_manual_slots:
  name: Clear manual slots
  description: Remove all manual slots

update_forecast:
  name: Update forecast
  description: Recalculate the load and PV forecast per quarter for today and tomorrow

update_battery_plan:
  name: Update battery plan
  description: Recalculate the battery plan from the current forecast, prices and battery state

set_ev_soc:
  name: Set car SOC
  description: >-
    Enter the car's state of charge for this charging session, so the plan knows
    how much it needs (from the SOC to the charge limit). Used while the car does
    not report its own SOC; cleared when the car is unplugged.
  fields:
    soc:
      name: SOC
      description: The car's state of charge now
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider
    charge_limit:
      name: Charge limit
      description: >-
        Charge up to it (sets number.energy_planner_ev_charge_limit, kept for later
        sessions). The car's charge limit sensor wins when one is configured.
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider
