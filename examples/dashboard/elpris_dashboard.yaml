    - type: markdown
      grid_options:
        columns: full
      content: <font color="#2dd4bf">●</font>&nbsp;Ladda &nbsp; <font color="#7c9cff">●</font>&nbsp;Vila
        &nbsp; <font color="#ff8a3d">●</font>&nbsp;Självförbrukning &nbsp; <font color="#ff5c7a">●</font>&nbsp;Sälj
        &nbsp; <font color="#f5c542">●</font>&nbsp;Sälj&nbsp;överskott &nbsp; <font color="#b78cff">●</font>&nbsp;Kasta&nbsp;överskott
        &nbsp; <font color="#8a94a6">●</font>&nbsp;Ingen&nbsp;plan
      card_mod:
        style:
          .: 'ha-card { border-radius: 20px; border: none; }'
          ha-markdown$: 'p { margin: 0; font-size: 13px; opacity: 0.85; }'
    - type: markdown
      content: "{%- set a = states.sensor.energy_planner_battery_plan.attributes if states.sensor.energy_planner_battery_plan\
        \ else {} -%}\n{%- set names = {\"charge\": \"Ladda\", \"self_use\": \"Självförbrukning\", \"\
        hold\": \"Vila\", \"sell\": \"Sälj\", \"sell_excess\": \"Sälj överskott\", \"discard_excess\"\
        : \"Kasta överskott\"} -%}\n{%- set act = states('sensor.energy_planner_battery_action') -%}\n\
        {%- set acts = {\"charge\": \"Laddar\", \"discharge\": \"Självförbrukning\", \"pause\": \"Vilar\"\
        , \"sell\": \"Säljer\", \"sell-excess\": \"Säljer överskott\", \"discard-excess\": \"Kastar överskott\"\
        } -%}\n**Batteriet nu:** {{ acts.get(act, act) }}{% if state_attr('sensor.energy_planner_battery_action','until')\
        \ %} till {{ as_datetime(state_attr('sensor.energy_planner_battery_action','until')).strftime('%H:%M')\
        \ }}{% endif %} · {{ states('sensor.solis_s6_solis_battery_soc') }} %\n\n{% if a.starts is defined\
        \ and a.starts -%}\n{%- set ns = namespace(rows=[], mode=None, start=None, n=0) -%}\n{%- for s\
        \ in a.starts -%}\n  {%- set m = a.modes[loop.index0] -%}\n  {%- if m != ns.mode -%}\n    {%-\
        \ if ns.mode is not none and ns.n < 8 -%}\n      {%- set ns.rows = ns.rows + [[ns.start, s, ns.mode,\
        \ a.soc[loop.index0 - 1]]] -%}\n      {%- set ns.n = ns.n + 1 -%}\n    {%- endif -%}\n    {%-\
        \ set ns.mode = m -%}{%- set ns.start = s -%}\n  {%- endif -%}\n{%- endfor -%}\n| Tid | Plan |\
        \ SOC |\n|:--|:--|--:|\n{% for r in ns.rows -%}\n| {{ ['mån','tis','ons','tor','fre','lör','sön'][as_datetime(r[0]).weekday()]\
        \ }} {{ as_datetime(r[0]).strftime('%H:%M') }}–{{ as_datetime(r[1]).strftime('%H:%M') }} | {{\
        \ names.get(r[2], r[2]) }} | {{ r[3] | round(0) | int }} % |\n{% endfor %}\n{%- else -%}\nIngen\
        \ plan just nu.\n{%- endif %}"
      grid_options:
        columns: full
      card_mod:
        style: *id001
