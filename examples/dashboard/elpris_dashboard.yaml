            \  const p = make();\n  cache[key] = {t: Date.now(), p};\n  p.catch(() => delete cache[key]);\n\
            \  return p;\n};\n// Kind 'd' (days) or 'm' (months) back from the current one: [from, to)\
            \ in ms\nconst period = (kind, back) => {\n  const n = new Date();\n  const from = kind ===\
            \ 'd' ? new Date(n.getFullYear(), n.getMonth(), n.getDate() - back)\n    : new Date(n.getFullYear(),\
            \ n.getMonth() - back, 1);\n  const to = kind === 'd' ? new Date(from.getFullYear(), from.getMonth(),\
            \ from.getDate() + 1)\n    : new Date(from.getFullYear(), from.getMonth() + 1, 1);\n  return\
            \ [from.getTime(), Math.min(to.getTime(), n.getTime())];\n};\nconst hourly = (from, to) =>\
