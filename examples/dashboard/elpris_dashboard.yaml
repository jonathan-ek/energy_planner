            \ of [from, to), split by period start (day or month): Map start -> totals\nconst totals =\
            \ async (from, to, key) => {\n  const r = await hourly(from, to);\n  const spot = new Map((r['sensor.nordpool_kwh_se3_sek_3_10_025']\
            \ || []).map((x) => [x.start, x.state * 1]));\n  const out = new Map();\n  const add = (x,\
