          \ 0, income: 0, saved: 0, without: 0, unpriced: 0, area: 0, hours: 0};\n    f(t, x.change ||\
          \ 0, spot.get(x.start));\n    out.set(k, t);\n  };\n  for (const x of r['sensor.matarstallning_aktiv_energi_uttag']\
          \ || []) add(x, (t, kwh, p) => {\n    t.bought += kwh;\n    if (p == null) t.unpriced += kwh;\
          \ else t.cost += kwh * (p + fee(x.start)) / 100;\n  });\n  for (const x of r['sensor.matarstallning_aktiv_energi_inmatning']\
          \ || []) add(x, (t, kwh, p) => {\n    t.sold += kwh;\n    if (p != null) t.income += kwh * (p\
          \ / 1.25 + sell(x.start)) / 100;\n  });\n  for (const x of r['sensor.elbesparing'] || []) add(x,\
          \ (t, kr) => { t.saved += kr; });\n  for (const x of r['sensor.elkostnad_utan_sol_och_batteri']\
          \ || []) add(x, (t, kr) => { t.without += kr; });\n  // The area's plain mean: what an even\
          \ load (a monthly price contract) pays, with the same fees\n  for (const [ms, p] of spot) add({start:\
          \ ms}, (t) => { t.area += p + fee(ms); t.hours += 1; });\n  return out;\n};\nconst monthStart\
          \ = (ms) => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), 1).getTime();\
          \ };\nconst value = (t, field) => field === 'area' ? (t.hours ? t.area / t.hours : null) : field\
          \ === 'avg' ? (t.bought - t.unpriced > 0 ? t.cost / (t.bought - t.unpriced) * 100 : null) :\
          \ t[field];\n\nconst from = period('m', 11)[0];\nconst sums = await totals(from, Date.now(),\
          \ monthStart);\nreturn [...sums.entries()].map(([ms, t]) => [ms, value(t, 'avg')]);\n"
