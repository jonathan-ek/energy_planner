title: Elpris
views:
- title: Elpris
  path: elpris
  icon: mdi:flash
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Elpris
      heading_style: title
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: markdown
        content: "{%- set h = now().hour -%}\n{%- set p = states('sensor.nordpool_kwh_se3_sek_3_10_025')\
          \ | float(0) * 1 + 45 + (18 if 6 <= h < 23 else 9) -%}\n{%- set ns = namespace(sum=0, n=0) -%}\n\
          {%- for r in state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_today') or [] -%}\n  {%-\
          \ set h = as_datetime(r.start).hour -%}\n  {%- set ns.sum = ns.sum + r.value * 1 + 45 + (18\
          \ if 6 <= h < 23 else 9) -%}\n  {%- set ns.n = ns.n + 1 -%}\n{%- endfor -%}\n{%- set avg = ns.sum\
          \ / ns.n if ns.n else 0 -%}\n{%- set q = now().replace(minute=(now().minute // 15) * 15, second=0,\
          \ microsecond=0) -%}\n<ha-icon icon=\"mdi:lightning-bolt\"></ha-icon> **Elpris nu** · {{ q.strftime('%H:%M')\
          \ }}–{{ (q + timedelta(minutes=15)).strftime('%H:%M') }}\n\n# {{ p | round(0) | int }} <small>öre</small>\n\
          \n{{ '▼' if p <= avg else '▲' }} snitt idag {{ avg | round(0) | int }} öre · inkl. skatt och\
          \ nätavgift"
        grid_options:
          columns: full
        card_mod:
          style: &id001
            .: 'ha-card { border-radius: 20px; border: none; padding: 4px 4px 8px; }'
            ha-markdown$: '

              h1 { font-size: 56px; font-weight: 700; line-height: 1.05; margin: 8px 0 6px; letter-spacing:
              -1px; }

              h1 small { font-size: 22px; font-weight: 500; opacity: 0.75; }

              p { margin: 2px 0; }

              table { width: 100%; border-collapse: collapse; border: none; }

              th { text-align: left; opacity: 0.6; font-weight: 500; font-size: 13px; }

              td, th { padding: 7px 2px; border: none !important; border-bottom: 1px solid rgba(127,127,127,0.15)
              !important; }

              '
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        update_interval: 5min
        now:
          show: true
          color: '#ffffff'
          label: ''
        header:
          show: false
        experimental:
          color_threshold: false
        yaxis:
        - show: false
          min: 0
        apex_config:
          chart:
            height: 70
            toolbar:
              show: false
            zoom:
              enabled: false
            background: transparent
          legend:
            show: false
          grid:
            show: false
            padding:
              left: 8
              right: 8
              top: -10
              bottom: -6
          xaxis:
            labels:
              format: HH
              style:
                fontSize: 11px
              show: true
            axisBorder:
              show: false
            axisTicks:
              show: false
            tooltip:
              enabled: false
          tooltip:
            x:
              format: ddd HH:mm
          stroke:
            width: 2
          dataLabels:
            enabled: false
          fill:
            type:
            - gradient
            - gradient
            - gradient
            - gradient
            - gradient
            - gradient
            - gradient
            opacity:
            - 1
            - 1
            - 1
            - 1
            - 1
            - 1
            - 1
            gradient:
              type: vertical
              shadeIntensity: 0
              opacityFrom: 0.45
              opacityTo: 0.04
              stops:
              - 0
              - 100
          yaxis:
            show: false
        card_mod:
          style: 'ha-card { border-radius: 20px; border: none; overflow: hidden; } ha-card { margin-top:
            -12px; } '
        grid_options:
          columns: full
        series:
        - entity: sensor.nordpool_kwh_se3_sek_3_10_025
          name: Ladda
          type: area
          curve: stepline
          color: '#2dd4bf'
          stroke_width: 2
          unit: öre
          float_precision: 0
          data_generator: "const fee = (ms) => { const h = new Date(ms).getHours(); return 45 + (h >=\
            \ 6 && h < 23 ? 18 : 9); };\nconst np = hass.states['sensor.nordpool_kwh_se3_sek_3_10_025'].attributes;\n\
            const pub = [...(np.raw_today || []), ...(np.raw_tomorrow || [])]\n  .map((p) => [new Date(p.start).getTime(),\
            \ p.value * 1, false]);\nconst last = pub.length ? pub[pub.length - 1][0] : 0;\nconst plan\
            \ = hass.states['sensor.energy_planner_battery_plan'].attributes;\nconst est = (plan.starts\
            \ || []).map((s, i) => [new Date(s).getTime(), plan.prices[i], (plan.estimated || [])[i]])\n\
            \  .filter((p) => p[0] > last && p[2]);\nconst all = [...pub, ...est].map((p) => [p[0], Math.round((p[1]\
            \ + fee(p[0])) * 10) / 10, p[2]]);\n\nconst groups = {\"charge\": \"charge\", \"hold\": \"\
            hold\", \"self_use\": \"self_use\", \"sell\": \"sell\", \"sell_excess\": \"sell_excess\",\
            \ \"discard_excess\": \"discard_excess\"};\nconst states = {\"charge\": \"charge\", \"pause\"\
            : \"hold\", \"discharge\": \"self_use\", \"sell\": \"sell\", \"sell-excess\": \"sell_excess\"\
            , \"discard-excess\": \"discard_excess\"};\nconst pa = hass.states['sensor.energy_planner_battery_plan'].attributes;\n\
            const mode = new Map((pa.starts || []).map((s, i) => [new Date(s).getTime(),\n  (pa.manual\
            \ || [])[i] ? states[pa.manual[i]] : pa.modes[i]]));\nconst group = (ms) => groups[mode.get(ms)]\
            \ || 'none';\nconst known = all.filter((p) => !p[2]);\nreturn known.map((p, i) => {\n  const\
            \ g = group(p[0]);\n  const prev = i > 0 ? group(known[i - 1][0]) : g;\n  return [p[0], g\
            \ === 'charge' || prev === 'charge' ? p[1] : null];\n});\n"
          extend_to: false
          show:
            in_header: false
            legend_value: false
