# Generated by build_elpris_dashboard.py --site owner: what electricity costs with the solar
# panels and the battery, and what the same house load would have cost bought from the grid
# without them. Spot price (Nord Pool, incl. VAT) plus energy tax and transfer fee; selling
# earns spot excl. VAT plus the network compensation. Power charges are not included.
# Copy to the home's packages (packages/elpris_besparing.yaml). The history before the
# sensors existed was imported into their statistics and the meters calibrated.
template:
- sensor:
  - name: Elkostnad per timme
    unique_id: elpris_cost_rate
    unit_of_measurement: SEK/h
    state_class: measurement
    availability: '{{ has_value(''sensor.nordpool_kwh_se3_sek_3_10_025'') and has_value(''sensor.aktiv_effekt_uttag_momentan_trefaseffekt'')
      and has_value(''sensor.aktiv_effekt_inmatning_momentan_trefaseffekt'') }}'
    state: |
      {% set spot = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float * 1 %}
      {% set h = now().hour %}
      {% set buy = spot + 45 + (18 if 6 <= h < 23 else 9) %}
      {% set sell = spot / 1.25 + (7.2 if now().month in [1, 2, 3, 11, 12] and now().isoweekday() <= 5 and 6 <= h < 22 else 5.1) %}
      {{ (((states('sensor.aktiv_effekt_uttag_momentan_trefaseffekt') | float) * buy - (states('sensor.aktiv_effekt_inmatning_momentan_trefaseffekt') | float) * sell) / 100) | round(4) }}
  - name: Elkostnad utan sol och batteri per timme
    unique_id: elpris_cost_without_system_rate
    unit_of_measurement: SEK/h
    state_class: measurement
    availability: '{{ has_value(''sensor.nordpool_kwh_se3_sek_3_10_025'') and has_value(''sensor.solis_s6_solis_household_load_power'')
      }}'
    state: |
      {% set spot = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float * 1 %}
      {% set h = now().hour %}
      {% set buy = spot + 45 + (18 if 6 <= h < 23 else 9) %}
      {{ (states('sensor.solis_s6_solis_household_load_power') | float / 1000 * buy / 100) | round(4) }}
  - name: Elbesparing per timme
    unique_id: elpris_saving_rate
    unit_of_measurement: SEK/h
    state_class: measurement
    availability: '{{ has_value(''sensor.elkostnad_per_timme'') and has_value(''sensor.elkostnad_utan_sol_och_batteri_per_timme'')
      }}'
    state: '{{ (states(''sensor.elkostnad_utan_sol_och_batteri_per_timme'') | float - states(''sensor.elkostnad_per_timme'')
      | float) | round(4) }}'
sensor:
- platform: integration
  name: Elkostnad
  unique_id: elpris_cost
  source: sensor.elkostnad_per_timme
  unit_time: h
  method: left
  round: 3
  max_sub_interval:
    minutes: 1
- platform: integration
  name: Elkostnad utan sol och batteri
  unique_id: elpris_cost_without_system
  source: sensor.elkostnad_utan_sol_och_batteri_per_timme
  unit_time: h
  method: left
  round: 3
  max_sub_interval:
    minutes: 1
- platform: integration
  name: Elbesparing
  unique_id: elpris_saving
  source: sensor.elbesparing_per_timme
  unit_time: h
  method: left
  round: 3
  max_sub_interval:
    minutes: 1
utility_meter:
  elbesparing_idag:
    source: sensor.elbesparing
    cycle: daily
    net_consumption: true
    periodically_resetting: false
  elbesparing_manad:
    source: sensor.elbesparing
    cycle: monthly
    net_consumption: true
    periodically_resetting: false
  elkostnad_idag:
    source: sensor.elkostnad
    cycle: daily
    net_consumption: true
    periodically_resetting: false
  elkostnad_utan_sol_och_batteri_idag:
    source: sensor.elkostnad_utan_sol_och_batteri
    cycle: daily
    net_consumption: true
    periodically_resetting: false
  elbesparing_totalt:
    source: sensor.elbesparing
    net_consumption: true
    periodically_resetting: false
