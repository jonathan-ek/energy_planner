        entity: sensor.energy_planner_load_forecast
        attribute: updated
        name: Uppdaterad
        format: relative
      - type: button
        name: Uppdatera prognos
        icon: mdi:refresh
        action_name: Kör
        tap_action:
          action: perform-action
          perform_action: energy_planner.update_forecast
- type: sections
  max_columns: 4
  title: Historik
  path: historik
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Ny sektion
    - type: history-graph
      entities:
      - entity: sensor.solis_s6_solis_pv_today_energy_generation
      hours_to_show: 120
      grid_options:
        columns: 12
        rows: 4
    - type: custom:apexcharts-card
      header:
        title: 'Igår: prognos mot utfall (kW, snitt per kvart)'
        show: true
      graph_span: 24h
      span:
        start: day
        offset: -1d
      apex_config:
        legend:
          show: true
        tooltip:
          shared: true
      yaxis:
      - id: kw
        min: 0
        decimals: 1
        apex_config:
          title:
            text: kW
      series:
      - entity: sensor.energy_planner_pv_forecast
        name: Sol, prognos dagen före
        type: area
        curve: stepline
        yaxis_id: kw
        color: '#f9a825'
        opacity: 0.3
        stroke_width: 1
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.yesterday_starts || [];
          const v = entity.attributes.yesterday_pv || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.solis_s6_solis_total_pv_power
        name: Sol, verklig
        type: line
        yaxis_id: kw
        color: '#e65100'
        stroke_width: 2
        unit: kW
        float_precision: 2
        transform: 'return x > 25000 ? null : x / 1000;'
        group_by:
          func: avg
          duration: 15min
      - entity: sensor.energy_planner_load_forecast
        name: Förbrukning, prognos
        type: line
        curve: stepline
        yaxis_id: kw
        color: '#1e88e5'
        stroke_width: 2
        stroke_dash: 4
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.yesterday_starts || [];
          const v = entity.attributes.yesterday_load || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.solis_s6_solis_household_load_power
        name: Förbrukning, verklig
        type: line
        yaxis_id: kw
        color: '#0d47a1'
        stroke_width: 2
        unit: kW
        float_precision: 2
        transform: return x / 1000;
        group_by:
          func: avg
          duration: 15min
      grid_options:
        columns: 18
        rows: 8
