# The owner's "Energi" dashboard (copied from HA on 2026-10-09, .storage/lovelace.dashboard_energi).
# Views: Home (plan, forecast and battery charts, slots, the Solis inverter), Settings
# (the planner's number/select/time entities, the add slot form) and Historik.
# Use: Settings > Dashboards > Add dashboard > open it > Edit > Raw configuration editor,
# paste this file. Replace the solis_s6_* entities with the local inverter's.
# HACS frontend cards needed: apexcharts-card, lovelace-multiple-entity-row,
# sunsynk-power-flow-card. The add slot form needs energy_planner_extras.yaml.
views:
- title: Home
  sections:
  - type: grid
    cards:
    - type: custom:sunsynk-power-flow-card
      cardstyle: compact
      show_solar: true
      battery:
        show_daily: true
        colour: pink
        animation_speed: 6
        max_power: 6000
        auto_scale: false
        show_absolute: false
        show_remaining_energy: false
        energy: 25600
        shutdown_soc: 15
      solar:
        mppts: 3
        show_daily: true
        colour: '#F4C430'
        animation_speed: 9
        max_power: 16000
        pv1_name: Fram
        pv2_name: Bak
        pv3_name: Garaget
        auto_scale: false
        pv3_max_power: 5000
        pv1_max_power: 6000
        pv2_max_power: 7000
      load:
        show_aux: false
        show_daily: true
        animation_speed: 8
        max_power: 6000
        additional_loads: 0
        load2_icon: ''
        load1_icon: ''
      grid:
        show_daily_buy: true
        no_grid_colour: red
        animation_speed: 8
        max_power: 6000
        invert_grid: true
        show_daily_sell: true
      entities:
        dc_transformer_temp_90: sensor.solis_s6_solis_temperature
        day_battery_charge_70: sensor.solis_s6_solis_today_battery_charge_energy
        day_battery_discharge_71: sensor.solis_s6_solis_today_battery_discharge_energy
        day_load_energy_84: sensor.solis_s6_solis_today_energy_consumption
        day_pv_energy_108: sensor.solis_s6_solis_pv_today_energy_generation
        inverter_voltage_154: sensor.solis_s6_solis_a_phase_voltage
        load_frequency_192: sensor.solis_s6_solis_grid_frequency
        inverter_current_164: sensor.solis_s6_solis_a_phase_current
        inverter_power_175: sensor.solis_s6_solis_backup_load_power
        grid_power_169: sensor.solis_s6_solis_ac_grid_port_power
        battery_voltage_183: sensor.solis_s6_solis_battery_voltage
        battery_soc_184: sensor.solis_s6_solis_battery_soc
        battery_power_190: sensor.solis_s6_solis_battery_power
        battery_current_191: sensor.solis_s6_solis_battery_current
        essential_power: sensor.solis_s6_solis_household_load_power
        grid_ct_power_172: sensor.solis_s6_solis_meter_total_active_power
        pv1_power_186: sensor.solis_s6_solis_pv_power_1
        pv2_power_187: sensor.solis_s6_solis_pv_power_2
        pv_total: sensor.solis_s6_solis_total_pv_power
        pv2_voltage_111: sensor.solis_s6_solis_pv_voltage_2
        grid_voltage: sensor.solis_s6_solis_a_phase_voltage
        battery_current_direction: sensor.solis_s6_solis_battery_current_direction
        remaining_solar: sensor.solcast_pv_forecast_forecast_remaining_today
        pv3_power_188: sensor.solis_s6_solis_pv_power_3
        pv4_power_189: sensor.solis_s6_solis_pv_power_4
        pv1_voltage_109: sensor.solis_s6_solis_pv_voltage_1
        pv1_current_110: sensor.solis_s6_solis_pv_current_1
        pv2_current_112: sensor.solis_s6_solis_pv_current_2
        pv3_voltage_113: sensor.solis_s6_solis_pv_voltage_3
        pv3_current_114: sensor.solis_s6_solis_pv_current_3
        inverter_status_59: sensor.solis_s6_solis_status
        day_grid_import_76: sensor.daily_energy_bought
        day_grid_export_77: sensor.daily_energy_sold
      view_layout:
        grid-area: flow
      large_font: true
      panel_mode: true
      card_height: 415px
      inverter:
        model: solis
        modern: false
        colour: '#959595'
        autarky: 'no'
        three_phase: false
        auto_scale: false
      grid_options:
        columns: 15
        rows: 7
    - type: history-graph
      entities:
      - entity: sensor.solis_s6_solis_pv_today_energy_generation
      grid_options:
        columns: 15
        rows: 6
    - type: markdown
      content: |-
        Inverter time: {{ states('sensor.solis_s6_solis_clock_hours') }}:{{ states('sensor.solis_s6_solis_clock_minutes') }}:{{ states('sensor.solis_s6_solis_clock_seconds') }}
        Last update: {{ strptime(states('sensor.solis_s6_eh3p_last_clock_adjustment'), '%Y-%m-%dT%H:%M:%S%z').strftime('%H:%M:%S') }}
      grid_options:
        columns: 6
        rows: auto
    column_span: 4
  - type: grid
    cards:
    - type: custom:apexcharts-card
      graph_span: 48h
      header:
        title: Elpriser idag och imorgon (Öre/kWh)
        show: true
        show_states: true
      apex_config:
        tooltip:
          fixed:
            enabled: true
            position: topLeft
            offsetX: 60
            offsetY: 20
        chart:
          zoom:
            enabled: true
            type: x
            autoScaleYaxis: true
            allowMouseWheelZoom: false
          toolbar:
            show: true
            autoSelected: none
            tools:
              download: false
              selection: false
              zoom: true
              zoomin: false
              zoomout: false
              pan: false
              reset: true
      span:
        start: day
      now:
        show: true
        label: Now
      series:
      - entity: sensor.nordpool_kwh_se3_sek_3_10_025
        type: column
        name: Pris
        float_precision: 2
        show:
          in_header: raw
          name_in_header: false
        data_generator: |
          return [...(entity.attributes.raw_today || []), ...(entity.attributes.raw_tomorrow || [])]
            .filter((p) => p && p.value !== null)
            .map((p) => [new Date(p.start).getTime(), p.value]);
      - entity: sensor.energy_planner_battery_plan
        type: column
        name: Uppskattat
        color: '#9e9e9e'
        opacity: 0.6
        float_precision: 2
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const a = entity.attributes;
          return (a.starts || [])
            .map((s, i) => [new Date(s).getTime(), a.estimated && a.estimated[i] ? a.prices[i] : null])
            .filter((p) => p[1] !== null);
      section_mode: true
      grid_options:
        columns: full
        rows: 6
    column_span: 3
  - type: grid
    cards:
    - type: custom:apexcharts-card
      header:
        title: Batteriplan
        show: true
      graph_span: 48h
      span:
        start: day
      now:
        show: true
        label: Nu
      apex_config:
        legend:
          show: true
        tooltip:
          shared: true
        chart:
          zoom:
            enabled: true
            type: x
            autoScaleYaxis: true
            allowMouseWheelZoom: false
          toolbar:
            show: true
            autoSelected: none
            tools:
              download: false
              selection: false
              zoom: true
              zoomin: false
              zoomout: false
              pan: false
              reset: true
      yaxis:
      - id: kw
        decimals: 1
        apex_config:
          title:
            text: kW
      - id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          title:
            text: SOC %
      series:
      - entity: sensor.energy_planner_battery_plan
        name: Import, laddning
        type: column
        yaxis_id: kw
        color: '#43a047'
        opacity: 0.7
        unit: kW
        float_precision: 2
        data_generator: |
          const a = entity.attributes; const s = a.starts || [];
          const q = (t) => new Date(t).getTime();
          return s.map((t, i) => [q(t), a.modes[i] === 'charge' ? a.grid_import[i] : 0]);
        extend_to: false
      - entity: sensor.energy_planner_battery_plan
        name: Import, övrigt
        type: column
        yaxis_id: kw
        color: '#1e88e5'
        opacity: 0.7
        unit: kW
        float_precision: 2
        data_generator: |
          const a = entity.attributes; const s = a.starts || [];
          const q = (t) => new Date(t).getTime();
          return s.map((t, i) => [q(t), a.modes[i] === 'charge' ? 0 : a.grid_import[i]]);
        extend_to: false
      - entity: sensor.energy_planner_battery_plan
        name: Export (sälj)
        type: column
        yaxis_id: kw
        color: '#f9a825'
        opacity: 0.7
        unit: kW
        float_precision: 2
        data_generator: |
          const a = entity.attributes; const s = a.starts || [];
          const q = (t) => new Date(t).getTime();
          return s.map((t, i) => [q(t), -a.grid_export[i]]);
        extend_to: false
      - entity: sensor.energy_planner_battery_plan
        name: Importmål
        type: line
        curve: stepline
        yaxis_id: kw
        color: '#e53935'
        stroke_width: 1
        stroke_dash: 4
        unit: kW
        float_precision: 2
        data_generator: |
          const a = entity.attributes; const s = a.starts || [];
          const q = (t) => new Date(t).getTime();
          return s.map((t, i) => [q(t), a.targets[i]]);
        extend_to: false
      - entity: sensor.aktiv_effekt_uttag_momentan_trefaseffekt
        name: Import, verklig
        type: line
        yaxis_id: kw
        color: '#0d47a1'
        stroke_width: 2
        unit: kW
        float_precision: 2
        group_by:
          func: avg
          duration: 15min
        extend_to: now
      - entity: sensor.energy_planner_battery_plan
        name: SOC, plan
        type: line
        yaxis_id: soc
        color: '#8e24aa'
        stroke_width: 2
        stroke_dash: 4
        unit: '%'
        float_precision: 0
        data_generator: |
          const a = entity.attributes; const s = a.starts || [];
          const q = (t) => new Date(t).getTime();
          return s.map((t, i) => [q(t) + 15 * 60000, a.soc[i]]);
        extend_to: false
      - entity: sensor.solis_s6_solis_battery_soc
        name: SOC, verklig
        type: line
        yaxis_id: soc
        color: '#6a1b9a'
        stroke_width: 2
        unit: '%'
        float_precision: 0
        extend_to: now
      grid_options:
        columns: full
        rows: full
    column_span: 3
  - type: grid
    cards:
    - type: custom:apexcharts-card
      header:
        title: Prognos idag och imorgon (kW, snitt per kvart)
        show: true
      graph_span: 48h
      span:
        start: day
      apex_config:
        legend:
          show: true
        tooltip:
          shared: true
        chart:
          zoom:
            enabled: true
            type: x
            autoScaleYaxis: true
            allowMouseWheelZoom: false
          toolbar:
            show: true
            autoSelected: none
            tools:
              download: false
              selection: false
              zoom: true
              zoomin: false
              zoomout: false
              pan: false
              reset: true
      yaxis:
      - id: kw
        min: 0
        decimals: 1
        apex_config:
          title:
            text: kW
      - id: price
        opposite: true
        decimals: 0
        apex_config:
          title:
            text: öre/kWh
      series:
      - entity: sensor.energy_planner_pv_forecast
        name: Sol, prognos
        type: area
        curve: stepline
        yaxis_id: kw
        color: '#f9a825'
        opacity: 0.3
        stroke_width: 1
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.starts || [];
          const v = entity.attributes.pv || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.energy_planner_load_forecast
        name: Förbrukning, prognos
        type: line
        curve: stepline
        yaxis_id: kw
        color: '#1e88e5'
        stroke_width: 2
        stroke_dash: 4
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.starts || [];
          const v = entity.attributes.load || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.energy_planner_load_forecast
        name: Planerat
        type: column
        yaxis_id: kw
        color: '#43a047'
        opacity: 0.6
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.starts || [];
          const v = entity.attributes.planned || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.energy_planner_load_forecast
        name: Reserv
        type: column
        yaxis_id: kw
        color: '#8e24aa'
        opacity: 0.5
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.starts || [];
          const v = entity.attributes.reserve || [];
          return s.map((t, i) => [new Date(t).getTime(), v[i] === null || v[i] === undefined ? null : v[i] * 4]);
      - entity: sensor.solis_s6_solis_total_pv_power
        name: Sol, verklig
        type: line
        yaxis_id: kw
        color: '#e65100'
        stroke_width: 2
        unit: kW
        float_precision: 2
        transform: 'return x > 25000 ? null : x / 1000;'
        group_by:
          func: avg
          duration: 15min
      - entity: sensor.solis_s6_solis_household_load_power
        name: Förbrukning, verklig
        type: line
        yaxis_id: kw
        color: '#0d47a1'
        stroke_width: 2
        unit: kW
        float_precision: 2
        transform: return x / 1000;
        group_by:
          func: avg
          duration: 15min
      - entity: sensor.nordpool_kwh_se3_sek_3_10_025
        name: Pris
        type: line
        curve: stepline
        yaxis_id: price
        color: '#9e9e9e'
        stroke_width: 1
        float_precision: 0
        data_generator: |
          return [...(entity.attributes.raw_today || []), ...(entity.attributes.raw_tomorrow || [])]
            .filter((p) => p && p.value !== null)
            .map((p) => [new Date(p.start).getTime(), p.value]);
      - entity: sensor.energy_planner_battery_plan
        name: Värmepump, plan
        type: line
        curve: stepline
        yaxis_id: kw
        color: '#e53935'
        stroke_width: 2
        unit: kW
        float_precision: 2
        data_generator: |
          const s = entity.attributes.starts || [];
          const v = entity.attributes.heat_pump || [];
          const kw = Number(hass.states['number.energy_planner_heat_pump_power']?.state || 300) / 1000;
          return s.map((t, i) => [new Date(t).getTime(), v[i] ? kw : 0]);
      grid_options:
        columns: full
        rows: full
      now:
        show: true
        label: Nu
    column_span: 3
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set a = state_attr('sensor.energy_planner_battery_plan', 'starts') and states.sensor.energy_planner_battery_plan.attributes -%}
        {%- if a -%}
        {%- set labels = {'self_use': 'Egenanvändning', 'hold': 'Håll', 'sell_excess': 'Sälj överskott', 'discard_excess': 'Kasta överskott', 'charge': '**Ladda**', 'sell': '**Sälj**'} -%}
        {%- set days = ['mån', 'tis', 'ons', 'tor', 'fre', 'lör', 'sön'] -%}
        {%- set targeted = ['hold', 'charge'] -%}
        | Tid | Läge | SOC % | Import kWh | Export kWh | Mål kW | VP |
        |:--|:--|--:|--:|--:|--:|:--|
        {% set ns = namespace(first=0, imp=0, exp=0) -%}
        {%- for i in range(a.starts | length) -%}
        {%- set ns.imp = ns.imp + a.grid_import[i] / 4 -%}
        {%- set ns.exp = ns.exp + a.grid_export[i] / 4 -%}
        {%- set mode = a.modes[i] -%}
        {%- if loop.last or a.modes[i + 1] != mode or (mode in targeted and a.targets[i + 1] != a.targets[i]) or (a.heat_pump and a.heat_pump[i + 1] != a.heat_pump[i]) -%}
        {%- set start = as_datetime(a.starts[ns.first]) | as_local -%}
        {%- set end = (as_datetime(a.starts[i]) | as_local) + timedelta(minutes=15) -%}
        {%- set before = a.soc[ns.first - 1] if ns.first > 0 else states('sensor.solis_s6_solis_battery_soc') | float(0) -%}
        | {{ days[start.weekday()] }} {{ start.strftime('%H:%M') }}–{{ end.strftime('%H:%M') }} | {{ labels.get(mode, mode) }} | {{ before | round(0) | int }} → {{ a.soc[i] | round(0) | int }} | {{ ns.imp | round(1) if ns.imp >= 0.05 else '' }} | {{ ns.exp | round(1) if ns.exp >= 0.05 else '' }} | {{ a.targets[i] if mode in targeted and a.targets[i] is not none else '' }} | {{ 'på' if a.heat_pump and a.heat_pump[i] else '' }} |
        {% set ns.first = i + 1 -%}
        {%- set ns.imp = 0 -%}
        {%- set ns.exp = 0 -%}
        {%- endif -%}
        {%- endfor %}

        Beräknad {{ (as_datetime(a.updated) | as_local).strftime('%H:%M') }}. Energi {{ a.energy_cost }} kr, slitage {{ a.wear_cost }} kr, ökad effektavgift {{ a.power_cost }} kr.
        {%- else -%}
        Ingen batteriplan ännu.
        {%- endif -%}
      grid_options:
        columns: 24
        rows: auto
    column_span: 3
  - type: grid
    cards:
    - type: vertical-stack
      title: Laddningsschema
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_1_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_1_active
            type: custom:multiple-entity-row
            name: Slot 1
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_1_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_1_state
            entities:
            - entity: number.energy_planner_slot_1_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_1_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_2_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_2_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_2_active
            type: custom:multiple-entity-row
            name: Slot 2
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_2_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_2_state
            entities:
            - entity: number.energy_planner_slot_2_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_2_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_3_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_3_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_3_active
            type: custom:multiple-entity-row
            name: Slot 3
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_3_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_3_state
            entities:
            - entity: number.energy_planner_slot_3_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_3_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_4_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_4_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_4_active
            type: custom:multiple-entity-row
            name: Slot 4
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_4_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_4_state
            entities:
            - entity: number.energy_planner_slot_4_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_4_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_5_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_5_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_5_active
            type: custom:multiple-entity-row
            name: Slot 5
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_5_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_5_state
            entities:
            - entity: number.energy_planner_slot_5_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_5_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_6_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_6_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_6_active
            type: custom:multiple-entity-row
            name: Slot 6
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_6_state
              name: false
            tap_action:
              action: more-info
              entity: select.energy_planner_slot_6_state
            entities:
            - entity: number.energy_planner_slot_6_soc
              name: SOC
              unit: false
            - entity: datetime.energy_planner_slot_6_date_time_start
              name: From
            - entity: datetime.energy_planner_slot_7_date_time_start
              name: To
      - type: conditional
        conditions:
        - condition: state
          entity: select.energy_planner_slot_7_state
          state_not: 'off'
        card:
          type: entities
          entities:
          - entity: switch.energy_planner_slot_7_active
            type: custom:multiple-entity-row
            name: Slot 7
            toggle: true
            state_color: true
            icon: mdi:timer
            secondary_info:
              entity: select.energy_planner_slot_7_state
              name: false
            tap_action:
