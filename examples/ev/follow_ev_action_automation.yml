# Starts and stops the car charger (here a Zaptec, "Garaget") from
# sensor.energy_planner_ev_action: charge in the plan's cheapest quarters before the
# ready time, wait otherwise (see AGENTS.md, "Car").
#
# Planner config store: ev_charger_status_sensor = sensor.garaget_laddstatus,
# ev_session_energy_sensor = sensor.garaget_session_total_charge, and once the car
# reports them (ESPHome Tesla BLE) ev_soc_sensor and ev_charge_limit_sensor.
# Turn off the car's own scheduled charging, or it may wait when the plan charges.
#
# Without a fresh plan the action is `charge`, so the car charges as without the
# planner; unplugged it has no state and nothing is done. Only writes when the
# charger differs from the action, and Zaptec's cloud API is rate limited, so the
# timer only runs every 15 minutes.
#
# Zaptec's charging switch is on while it charges; turning it off pauses
# (stop_charging_final: connected_finished with a final stop), and only then can it
# be turned on again. While the car itself is full or waits (connected_finished
# without a final stop, connected_requesting) the switch is unavailable, so nothing
# is sent.
#
# The fuse guard (sensor.energy_planner_fuse_guard, planner/fuse.py) sets the
# charger's current (number.garaget_charger_max_current, also the planner's
# ev_charger_current_number) so the busiest phase stays below the main fuse; at 0 A
# (below the charger's lowest current) the car pauses. It lowers the current at once
# and raises it at most every 15 minutes.
alias: Follow car charging action
description: ""
triggers:
  - trigger: state
    entity_id:
      - sensor.energy_planner_ev_action
  # A car just plugged in starts charging at once, and the switch only turns on a
  # moment after the action is set (it is unavailable until then): apply the action
  # when charging starts
  - trigger: state
    entity_id:
      - switch.garaget_laddar
    to: "on"
  - trigger: time_pattern
    minutes: /15
  - trigger: state
    entity_id:
      - sensor.energy_planner_fuse_guard
    attribute: ev_current_a
conditions: []
variables:
  # None without a guard
  guard_a: "{{ state_attr('sensor.energy_planner_fuse_guard', 'ev_current_a') }}"
actions:
  - if:
      - condition: template
        value_template: >-
          {{ guard_a is number and guard_a >= 6
             and guard_a != states('number.garaget_charger_max_current') | float(0) }}
    then:
      - action: number.set_value
        target:
          entity_id: number.garaget_charger_max_current
        data:
          value: "{{ guard_a }}"
  - choose:
      - conditions:
          - condition: state
            entity_id: sensor.energy_planner_ev_action
            state: charge
          - condition: template
            value_template: "{{ guard_a != 0 }}"
          - condition: state
            entity_id: switch.garaget_laddar
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.garaget_laddar
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: sensor.energy_planner_ev_action
                state: wait
              - condition: template
                value_template: "{{ guard_a == 0 }}"
          - condition: state
            entity_id: switch.garaget_laddar
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.garaget_laddar
mode: single
