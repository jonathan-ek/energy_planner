# Runs follow_battery_action.py with DISPATCH = True, copied to
# config/python_scripts/follow_battery_action_dispatch.py, so the plain script and
# its automation (follow_battery_action_automation.yml or the older
# update_battery_action) stay as a fallback: turn this automation off and the old one
# on, and the dispatch failsafe ends within DISPATCH_FAILSAFE (3) minutes. Only one of
# them may be on. See docs/solis_remote_dispatch_2026_10.md.
alias: Follow battery action (dispatch)
description: >-
  Makes the inverter follow sensor.energy_planner_battery_action, charging and
  selling through Solis Remote Dispatch
  (python_scripts/follow_battery_action_dispatch.py).
triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
      - sensor.energy_planner_battery_action
  # The fuse guard's grid limit follows the meter (every 10-20 s); the script
  # repeats an unchanged command at most every DISPATCH_REFRESH seconds
  - trigger: state
    entity_id:
      - sensor.energy_planner_fuse_guard
    attribute: grid_limit_kw
actions:
  - action: python_script.follow_battery_action_dispatch
    metadata: {}
    data: {}
mode: single
