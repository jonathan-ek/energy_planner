[project]
name = "energy-planner"
version = "0.0.1"
description = "Energy planner for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "homeassistant~=2026.9.4",
    "python-dateutil",
    "voluptuous",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.12.1",
    "ty>=0.0.85",
]

[tool.uv]
# A Home Assistant custom component, not an installable package
package = false
